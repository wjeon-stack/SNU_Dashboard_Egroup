<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E조 코칭 진행 현황 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16235C;
    --blue:#2F6FED;
    --blue-tint:#EAF1FF;
    --orange:#FF7A32;
    --orange-tint:#FFF0E4;
    --pink:#FF4D79;
    --pink-tint:#FFEAF0;
    --green:#1FA97A;
    --green-tint:#E4F7EF;
    --paper:#F5F7FC;
    --white:#FFFFFF;
    --ink:#20242C;
    --slate:#697386;
    --line:#E7ECF7;
    --danger:#D9455F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{background:var(--navy);}
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background:var(--navy);
    color:var(--ink);
    line-height:1.6;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px 60px;}

  .band{position:relative; height:60px; overflow:hidden;}
  .band .star{position:absolute; color:#FFFFFF; opacity:.85;}
  .band .star.s1{top:14px; left:10%; font-size:15px;}
  .band .star.s2{top:32px; left:24%; font-size:9px;}
  .band .star.s3{top:8px; right:14%; font-size:12px;}
  .band .star.s4{top:34px; right:6%; font-size:16px;}
  .band .dot{position:absolute; border-radius:50%; background:rgba(255,255,255,.35);}
  .band .dot.d1{width:7px; height:7px; top:20px; left:42%;}
  .band .dot.d2{width:5px; height:5px; top:40px; right:30%;}

  .sheet{
    background:var(--white);
    border-radius:22px;
    margin-top:-20px;
    box-shadow:0 18px 40px rgba(15,25,70,0.25);
  }
  .sheet-inner{padding:28px 26px 30px;}
  @media (max-width:640px){ .sheet-inner{padding:20px 14px 24px;} }

  .hero{padding:6px 0 20px;}
  .hero .eyebrow{
    display:inline-block;
    font-size:12px; font-weight:800; letter-spacing:.03em;
    color:var(--white); background:var(--orange);
    padding:6px 14px; border-radius:999px; margin-bottom:14px;
  }
  .hero h1{
    font-size:22px; font-weight:800; color:var(--navy);
    margin:0 0 6px; letter-spacing:-0.01em; line-height:1.4; word-break:keep-all;
  }
  .hero p{font-size:13.5px; color:var(--slate); margin:0; word-break:keep-all;}

  .summary-title{font-size:14px; font-weight:800; color:var(--navy); margin:18px 0 8px;}
  .step-summary-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  .step-summary{border-collapse:collapse; width:100%; min-width:640px;}
  .step-summary th{
    background:var(--paper); color:var(--slate); font-size:11.5px; font-weight:800;
    padding:8px 6px; text-align:center; white-space:pre-line; border-bottom:1px solid var(--line);
  }
  .step-summary th:first-child{text-align:left; padding-left:12px;}
  .step-summary td{
    padding:8px 6px; text-align:center; font-size:13px; font-weight:700; color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .step-summary tr:last-child td{border-bottom:none;}
  .step-summary td:first-child{text-align:left; padding-left:12px; font-weight:800; color:var(--navy); white-space:pre-line;}
  .step-summary td.cnt-미진행{color:var(--slate);}
  .step-summary td.cnt-진행예정{color:var(--blue);}
  .step-summary td.cnt-진행완료{color:var(--green);}
  .step-summary td.cnt-기타{color:var(--orange);}
  .step-summary td.cnt-clickable{
    cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;
  }
  .step-summary td.cnt-clickable:hover{background:var(--paper);}

  @keyframes cellFlash{
    0%{box-shadow:inset 0 0 0 2px var(--orange); background:var(--orange-tint);}
    100%{box-shadow:inset 0 0 0 2px transparent; background:transparent;}
  }
  tbody td.cell-flash{animation:cellFlash 1.8s ease-out; border-radius:10px;}
  .step-summary td.zero{color:#C7CCDA; font-weight:600;}

  .table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:14px; margin-top:8px;}
  table{border-collapse:collapse; width:100%; min-width:1560px;}
  thead th{
    background:var(--navy); color:var(--white); font-size:12.5px; font-weight:700;
    padding:10px 8px; text-align:center; position:sticky; top:0; white-space:pre-line;
  }
  thead th.who-col{text-align:left; padding-left:14px; min-width:150px;}
  tbody td{
    border-top:1px solid var(--line); padding:6px 6px; vertical-align:top; text-align:center;
    min-width:140px;
  }
  tbody tr:nth-child(even){background:#FBFCFF;}
  tbody tr.leader-row{background:var(--blue-tint);}
  .who-cell{text-align:left; padding-left:14px !important; white-space:nowrap;}
  .coach-name{font-size:14px; font-weight:800; color:var(--navy);}
  .leader-badge{
    display:inline-block; font-size:10px; font-weight:800; color:var(--white);
    background:var(--orange); border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:middle;
  }
  .coachee-name{font-size:12px; color:var(--slate); margin-top:2px;}

  .cell-box{display:flex; flex-direction:column; gap:4px; align-items:stretch;}
  .cell-row{display:flex; align-items:center; gap:5px;}
  .field-label{
    font-size:9.5px; font-weight:800; color:#B7BFCF; width:40px; flex-shrink:0; text-align:left;
    white-space:nowrap;
  }
  select.status-select{
    font-family:inherit; font-size:11.5px; font-weight:700; border-radius:8px; border:1.5px solid var(--line);
    padding:5px 4px; outline:none; cursor:pointer; appearance:none; -webkit-appearance:none;
    background-repeat:no-repeat; background-position:right 4px center; background-size:10px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23697386' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    padding-right:16px; text-align:center; text-align-last:center; flex:1; min-width:0;
  }
  select.status-select:focus{border-color:var(--blue);}
  .st-미진행{background:var(--paper); color:var(--slate);}
  .st-진행예정{background:var(--blue-tint); color:var(--blue);}
  .st-진행완료{background:var(--green-tint); color:var(--green);}
  .st-기타{background:var(--orange-tint); color:var(--orange);}

  .field-input{
    font-family:inherit; font-size:11px; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); border-radius:8px; padding:4px 5px; outline:none;
    flex:1; min-width:0; text-align:center;
  }
  .field-input:focus{border-color:var(--blue); background:var(--white);}
  .field-input::placeholder{color:#B7BFCF;}

  .date-group{display:flex; gap:4px; flex:1; min-width:0;}
  select.date-part{
    font-family:inherit; font-size:11px; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); border-radius:8px; padding:4px 2px; outline:none; cursor:pointer;
    flex:1; min-width:0; text-align:center; text-align-last:center;
    appearance:none; -webkit-appearance:none;
  }
  select.date-part:focus{border-color:var(--blue); background:var(--white);}

  .saved-toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:var(--white); font-size:12.5px; font-weight:700;
    padding:9px 18px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;
  }
  .saved-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .legend{display:flex; flex-wrap:wrap; gap:14px; margin:14px 2px 4px; font-size:12px; color:var(--slate); font-weight:700;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}

  .top-actions{display:flex; justify-content:flex-end; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  .btn{
    font-size:12px; font-weight:800; border:1px solid var(--line); background:var(--paper); color:var(--slate);
    padding:8px 14px; border-radius:10px; cursor:pointer;
  }
  .btn:hover{background:#EDF0F8;}
  .btn.primary{background:var(--blue); color:var(--white); border-color:var(--blue);}
  .btn.primary:hover{background:#2560D8;}

  .state-msg{padding:40px 10px; text-align:center; color:var(--slate); font-size:13.5px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="band">
    <span class="star s1">✦</span><span class="star s2">✧</span><span class="star s3">✦</span><span class="star s4">✧</span>
    <span class="dot d1"></span><span class="dot d2"></span>
  </div>

  <div class="sheet">
    <div class="sheet-inner">
      <div class="hero">
        <span class="eyebrow">CLIPS × SNU × 삼성</span>
        <h1>E조 코칭 진행 현황 (리더 코치: 최호석)</h1>
      </div>

      <div class="top-actions">
        <button class="btn primary" id="exportBtn">백업 다운로드 (Excel)</button>
      </div>

      <div class="summary-title" id="summaryTitle">단계별 진행 현황</div>
      <div class="step-summary-wrap"><div id="summaryBox"></div></div>

      <div class="legend">
        <span><i style="background:var(--slate)"></i>미진행</span>
        <span><i style="background:var(--blue)"></i>진행예정</span>
        <span><i style="background:var(--green)"></i>진행완료</span>
        <span><i style="background:var(--orange)"></i>기타(직접기입)</span>
      </div>

      <div id="tableArea" class="table-scroll"></div>
    </div>
  </div>
</div>

<div class="saved-toast" id="savedToast">저장됨</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const TEAM_CODE = "E";
const TEAM_LABEL = "E조";
const STORAGE_KEY = "coaching_dashboard_" + TEAM_CODE + "_v1";

const STEPS = [
  ['pre', '프리세션'],
  ['s1', '1회기'],
  ['s2', '2회기'],
  ['s3', '3회기\n(선택)']
];
const STATUS_OPTIONS = ['미진행', '진행예정', '진행완료', '기타'];

// 05번 폴더 매칭결과 기준 이 조의 코치-피코치 목록 (리더 코치가 맨 위)
const PAIRS = [{"coach":"최호석","coachee":"이주현","isLeader":true},{"coach":"박혜준","coachee":"유우정"},{"coach":"설도환","coachee":"원종빈"},{"coach":"신자영","coachee":"김주연"},{"coach":"신정호","coachee":"최민서"},{"coach":"안나은","coachee":"이정환"}];

function loadState() {
  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch (e) { saved = {}; }

  const state = {};
  const counter = {};
  PAIRS.forEach(function (p) {
    counter[p.coach] = (counter[p.coach] || 0) + 1;
    const pairId = TEAM_CODE + '-' + p.coach + '-' + counter[p.coach];
    p.pairId = pairId;
    const savedPair = saved[pairId] || {};
    const steps = {};
    STEPS.forEach(function (s) {
      const savedStep = savedPair[s[0]] || {};
      steps[s[0]] = {
        status: savedStep.status || '미진행',
        date: savedStep.date || '',
        note: savedStep.note || ''
      };
    });
    state[pairId] = steps;
  });
  return state;
}

let state = loadState();

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderSummary();
  showToast();
}

let toastTimer;
function showToast() {
  const t = document.getElementById('savedToast');
  t.textContent = '저장됨';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1200);
}

function appendOption(select, value, label, selected) {
  const o = document.createElement('option');
  o.value = value; o.textContent = label;
  if (selected) o.selected = true;
  select.appendChild(o);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function computeStepBreakdown() {
  return STEPS.map(function (s) {
    const counts = { '미진행': 0, '진행예정': 0, '진행완료': 0, '기타': 0 };
    PAIRS.forEach(function (p) {
      const st = state[p.pairId][s[0]].status;
      counts[st] = (counts[st] || 0) + 1;
    });
    return { key: s[0], label: s[1], counts: counts };
  });
}

function renderSummary() {
  const breakdown = computeStepBreakdown();
  document.getElementById('summaryTitle').textContent = '단계별 진행 현황 (총 ' + PAIRS.length + '인)';

  const box = document.getElementById('summaryBox');
  box.innerHTML = '';
  const table = document.createElement('table');
  table.className = 'step-summary';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  trh.appendChild(el('th', '', '단계'));
  ['미진행', '진행예정', '진행완료', '기타'].forEach(function (opt) { trh.appendChild(el('th', '', opt)); });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  breakdown.forEach(function (row) {
    const tr = document.createElement('tr');
    tr.appendChild(el('td', '', row.label));
    ['미진행', '진행예정', '진행완료', '기타'].forEach(function (opt) {
      const n = row.counts[opt];
      const td = el('td', n ? 'cnt-' + opt : 'zero', String(n));
      if (n) {
        td.classList.add('cnt-clickable');
        td.title = row.label + ' · ' + opt + '인 표시로 이동';
        td.addEventListener('click', function () {
          scrollToStepStatus(row.key, opt);
        });
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
}

function scrollToStepStatus(stepKey, status) {
  const matches = PAIRS.filter(function (p) {
    return state[p.pairId][stepKey].status === status;
  });
  if (!matches.length) return;

  const firstTd = cellRefs[matches[0].pairId + '|' + stepKey];
  if (firstTd) firstTd.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });

  matches.forEach(function (p) {
    const td = cellRefs[p.pairId + '|' + stepKey];
    if (!td) return;
    td.classList.add('cell-flash');
    setTimeout(function () { td.classList.remove('cell-flash'); }, 1800);
  });
}

function debounce(fn, wait) {
  let t;
  return function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(null, args); }, wait);
  };
}

const cellRefs = {};

function renderTable() {
  const area = document.getElementById('tableArea');
  area.innerHTML = '';

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  trh.appendChild(el('th', 'who-col', '코치 / 피코치'));
  STEPS.forEach(function (s) { trh.appendChild(el('th', '', s[1])); });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  PAIRS.forEach(function (p) {
    const tr = document.createElement('tr');
    if (p.isLeader) tr.classList.add('leader-row');

    const whoTd = el('td', 'who-cell');
    const nameLine = el('div');
    nameLine.appendChild(el('span', 'coach-name', p.coach));
    if (p.isLeader) nameLine.appendChild(el('span', 'leader-badge', '리더 코치'));
    whoTd.appendChild(nameLine);
    whoTd.appendChild(el('div', 'coachee-name', '피코치: ' + p.coachee));
    tr.appendChild(whoTd);

    STEPS.forEach(function (s) {
      const stepKey = s[0];
      const stepData = state[p.pairId][stepKey];
      const td = document.createElement('td');
      cellRefs[p.pairId + '|' + stepKey] = td;
      const box = el('div', 'cell-box');

      const select = document.createElement('select');
      select.className = 'status-select st-' + stepData.status;
      STATUS_OPTIONS.forEach(function (opt) {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        if (opt === stepData.status) o.selected = true;
        select.appendChild(o);
      });
      select.addEventListener('change', function () {
        stepData.status = select.value;
        select.className = 'status-select st-' + select.value;
        saveState();
      });

      const dateParts = (stepData.date || '').split('-'); // ['MM','DD']
      const monthSel = document.createElement('select');
      monthSel.className = 'field-input date-part';
      const dayVal = dateParts[1] || '';
      const monthVal = dateParts[0] || '';
      appendOption(monthSel, '', '월');
      for (let m = 1; m <= 12; m++) {
        const mm = String(m).padStart(2, '0');
        appendOption(monthSel, mm, m + '월', mm === monthVal);
      }
      const daySel = document.createElement('select');
      daySel.className = 'field-input date-part';
      appendOption(daySel, '', '일');
      for (let d = 1; d <= 31; d++) {
        const dd = String(d).padStart(2, '0');
        appendOption(daySel, dd, d + '일', dd === dayVal);
      }
      const syncDate = function () {
        stepData.date = (monthSel.value && daySel.value) ? (monthSel.value + '-' + daySel.value) : '';
        saveState();
      };
      monthSel.addEventListener('change', syncDate);
      daySel.addEventListener('change', syncDate);
      const dateGroup = el('div', 'date-group');
      dateGroup.appendChild(monthSel);
      dateGroup.appendChild(daySel);

      const note = document.createElement('input');
      note.type = 'text';
      note.className = 'field-input note-input';
      note.placeholder = '비고';
      note.value = stepData.note || '';
      const debouncedSave = debounce(function () {
        stepData.note = note.value;
        saveState();
      }, 500);
      note.addEventListener('input', debouncedSave);
      note.addEventListener('blur', function () {
        stepData.note = note.value;
        saveState();
      });

      [
        ['진행현황', select],
        ['일자', dateGroup],
        ['비고', note]
      ].forEach(function (pair) {
        const row = el('div', 'cell-row');
        row.appendChild(el('span', 'field-label', pair[0]));
        row.appendChild(pair[1]);
        box.appendChild(row);
      });

      td.appendChild(box);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  area.appendChild(table);
}

function renderAll() {
  renderSummary();
  renderTable();
}

function todayStamp() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return yyyy + '' + mm + dd;
}

const STATUS_COLORS = {
  '미진행': { fg: '697386', bg: 'F5F7FC' },
  '진행예정': { fg: '2F6FED', bg: 'EAF1FF' },
  '진행완료': { fg: '1FA97A', bg: 'E4F7EF' },
  '기타': { fg: 'FF7A32', bg: 'FFF0E4' }
};
const THIN_BORDER = { style: 'thin', color: { rgb: 'E7ECF7' } };
const BORDER_ALL = { top: THIN_BORDER, bottom: THIN_BORDER, left: THIN_BORDER, right: THIN_BORDER };

document.getElementById('exportBtn').addEventListener('click', function () {
  const headers = ['코치', '피코치', '단계', '진행현황', '일자(월-일)', '비고'];
  const dataRows = [];
  PAIRS.forEach(function (p) {
    STEPS.forEach(function (s) {
      const sd = state[p.pairId][s[0]];
      dataRows.push([p.coach, p.coachee, s[1].replace(/\n/g, ' '), sd.status, sd.date || '', sd.note || '']);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet([headers].concat(dataRows));
  const range = XLSX.utils.decode_range(ws['!ref']);

  for (let R = range.s.r; R <= range.e.r; R++) {
    const pairIndex = Math.floor((R - 1) / STEPS.length);
    const isLeaderRow = R > 0 && PAIRS[pairIndex] && PAIRS[pairIndex].isLeader;

    for (let C = range.s.c; C <= range.e.c; C++) {
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      const cell = ws[addr];
      if (!cell) continue;

      if (R === 0) {
        cell.s = {
          fill: { fgColor: { rgb: '16235C' } },
          font: { color: { rgb: 'FFFFFF' }, bold: true, sz: 11 },
          alignment: { horizontal: 'center', vertical: 'center' },
          border: BORDER_ALL
        };
        continue;
      }

      let fill = isLeaderRow ? 'EAF1FF' : (R % 2 === 0 ? 'FFFFFF' : 'FBFCFF');
      let fontColor = '20242C';
      let bold = (C === 0 && isLeaderRow);
      const align = (C === 0 || C === 1 || C === 2 || C === 5) ? 'left' : 'center';

      if (C === 3) {
        const colors = STATUS_COLORS[cell.v];
        if (colors) { fill = colors.bg; fontColor = colors.fg; bold = true; }
      }

      cell.s = {
        fill: { fgColor: { rgb: fill } },
        font: { color: { rgb: fontColor }, bold: bold, sz: 10.5 },
        alignment: { horizontal: align, vertical: 'center' },
        border: BORDER_ALL
      };
    }
  }

  ws['!cols'] = [
    { wch: 10 }, { wch: 10 }, { wch: 16 }, { wch: 10 }, { wch: 12 }, { wch: 26 }
  ];
  ws['!rows'] = [{ hpx: 22 }];
  ws['!autofilter'] = { ref: ws['!ref'] };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, TEAM_LABEL + ' 현황');

  const filename = TEAM_LABEL + '_코칭현황_백업_' + todayStamp() + '.xlsx';
  const lastRow = dataRows.length + 1; // header is row 1

  // xlsx-js-style이 데이터 유효성 검사(드롭다운)를 직접 지원하지 않아,
  // 생성된 xlsx를 JSZip으로 열어 진행현황(D열) 셀에 목록 드롭다운을 수동으로 추가한다.
  const arrBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

  JSZip.loadAsync(arrBuffer).then(function (zip) {
    const sheetPath = 'xl/worksheets/sheet1.xml';
    return zip.file(sheetPath).async('string').then(function (xml) {
      const dvXml = '<dataValidations count="1"><dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="D2:D' + lastRow + '"><formula1>"' + STATUS_OPTIONS.join(',') + '"</formula1></dataValidation></dataValidations>';
      const insertBefore = xml.indexOf('<ignoredErrors');
      const newXml = insertBefore !== -1
        ? xml.slice(0, insertBefore) + dvXml + xml.slice(insertBefore)
        : xml.replace('</worksheet>', dvXml + '</worksheet>');
      zip.file(sheetPath, newXml);
      return zip.generateAsync({ type: 'blob' });
    });
  }).then(function (blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  });
});

renderAll();
</script>
</body>
</html>
